const alg=r=>{let k=r.ing.map(i=>i.k),A=[];if(k.some(x=>DAIRY.includes(x)))A.push('süt');if(k.includes('yumurta'))A.push('yumurta');if(k.some(x=>GLU.includes(x)))A.push('gluten');if(k.includes('somon')||k.includes('ton'))A.push('balık');if(k.includes('tahin'))A.push('susam');if(k.includes('soya'))A.push('soya');return A};
const okR=r=>{let s=S.set;return!s.avoid.some(a=>r.ing.some(i=>i.k===a))&&(!s.diet||lab(r).includes(DM[s.diet]))&&(!s.maxT||r.t<=s.maxT)};
const mt=r=>{let e=r.ing.filter(i=>!i.s),miss=e.filter(i=>!have(i.k));return{miss,pct:Math.round(100*(e.length-miss.length)/e.length)}};
const grad=id=>{let h=id*47%360;return`linear-gradient(135deg,hsl(${h} 45% 82%),hsl(${(h+40)%360} 45% 72%))`};
let V='home',Q='',PQ='',F={},DV=null,CS=0,PM='';
const go=v=>{V=v;render();scrollTo(0,0)};
const card=r=>{let m=mt(r),b=Object.keys(S.pan).length?`<span class="b ${m.miss.length?'':'ok'}">${m.miss.length?m.miss.length+' eksik':'Hepsi var'} · %${m.pct}</span>`:'';return`<div class="rc" onclick="show(${r.id})"><div class="im" style="background:${grad(r.id)}">${r.e}</div><div class="ri"><b>${r.n}</b><small>${r.cu} · ${r.cat}</small><small>⏱ ${r.t} dk · ${r.z} · ${'₺'.repeat(r.c)}</small>${b}</div></div>`};
const cards=a=>a.length?a.map(card).join(''):'<div class="note">Sonuç bulunamadı. Filtreleri veya tercihlerdeki hariç tutulan malzemeleri gevşetmeyi deneyin.</div>';
const ranked=()=>R.filter(okR).map(r=>({r,m:mt(r)})).sort((a,b)=>a.m.miss.length-b.m.miss.length||b.m.pct-a.m.pct||a.r.t-b.r.t);
function show(id){DV={id,s:S.set.serv};S.rec=[id,...S.rec.filter(x=>x!==id)].slice(0,6);sv();go('det')}
function tfav(id){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id];sv();render()}
function surprise(){let a=ranked().slice(0,10);if(!a.length)return alert('Tercihlerinize uygun tarif yok.');show(a[Math.random()*a.length|0].r.id)}
function tg(k){if(S.pan[k])delete S.pan[k];else S.pan[k]={st:'var'};sv();render()}
function pu(k,f,v){if(S.pan[k]){S.pan[k][f]=v;sv();if(f=='st')render()}}
function addC(){let n=PQ.trim().toLowerCase().replace(/[^a-z0-9çğıöşü ]/gi,'').trim();if(!n)return alert('Malzeme adı yazın.');let k=IN[n]?n:'c:'+n;S.pan[k]={st:'var',n};PQ='';sv();render()}
function tf(k){F[k]=!F[k];render()}
function filt(){let q=Q.toLowerCase(),l=ranked().filter(({r,m})=>(!q||(r.n+r.o+r.cu+r.cat).toLowerCase().includes(q))&&(!F.all||!m.miss.length)&&(!F.two||m.miss.length<=2)&&(!F.t30||r.t<=30)&&(!F.eco||r.c==1)&&(!F.dish||r.d==1)&&(!F.t15||r.t<=15)&&(!F.one||r.fl.includes('o'))&&(!F.kid||r.fl.includes('k'))&&(!F.cu||r.cu==F.cu)).map(x=>x.r);return l}
function lst(){let e=document.getElementById('list');if(e)e.innerHTML=cards(filt())}
function cl(){let e=document.getElementById('cat');if(e)e.innerHTML=catList()}
function catList(){let q=PQ.toLowerCase(),o='';Object.keys(CAT).forEach(c=>{let it=Object.keys(IN).filter(k=>IN[k].c==c&&IN[k].n.toLowerCase().includes(q));if(it.length)o+=`<h3>${CAT[c]}</h3>`+it.map(k=>`<button class="ch ${S.pan[k]?'on':''}" onclick="tg('${k}')">${IN[k].n}</button>`).join('')});return o||'<div class="note">Bulunamadı. Yukarıdaki “Özel ekle” ile kendi malzemenizi ekleyebilirsiniz.</div>'}
function addShop(n,k,q,u){let x=S.shop.find(i=>i.k==k&&i.u==u&&!i.done&&k);if(x)x.q+=q;else S.shop.push({id:Date.now()+Math.random(),n,k,q,u,done:0})}
function need(r,f){let o=[];r.ing.filter(i=>!i.s).forEach(i=>{let p=S.pan[i.k],q=i.q*f;if(p&&p.st!=='bitti'){if(!(+p.q>0)||p.u!=i.u)return;q-=+p.q;if(q<=0)return}o.push({...i,q})});return o}
function shopFrom(r,f){let n=need(r,f);n.forEach(i=>addShop(nm(i.k),i.k,i.q,i.u));sv();return n.length}
function addMiss(id){let r=RB[id],n=shopFrom(r,DV.s/r.sv);alert(n?n+' malzeme alışveriş listesine eklendi.':'Eklenecek eksik malzeme yok.');render()}
function fromPlan(){let c=0,t={};Object.values(S.plan).forEach(id=>{let r=RB[id];if(r)need(r,S.set.serv/r.sv).forEach(i=>{let key=i.k+'|'+i.u;t[key]=t[key]||{...i,q:0};t[key].q+=i.q})});Object.values(t).forEach(i=>{addShop(nm(i.k),i.k,i.q,i.u);c++});sv();alert(c?c+' kalem listeye eklendi (kilerde miktarı bilinen malzemeler düşüldü; miktarı girilmemiş olanlar “var” kabul edilip atlandı).':'Önce plana yemek ekleyin.');go('shop')}
function sp(i,v){if(v)S.plan[i]=+v;else delete S.plan[i];sv();render()}
function auto(){let c=R.filter(r=>okR(r)&&!['Tatlı','Meze','Kahvaltı','Atıştırmalık'].includes(r.cat)),used=[],cu={},keys=new Set(),pl={},prev='';PM='';
for(let i=0;i<7;i++){let b=null,bs=-1e9;c.forEach(r=>{let p=r.ing.find(x=>PROT.includes(x.k)),pk=p?p.k:'';let s=Math.random()+mt(r).pct/50-(used.includes(r.id)?9:0)-(pk&&pk==prev?4:0)-(cu[r.cu]||0)*1.2+r.ing.filter(x=>!x.s&&keys.has(x.k)).length*.5;if(s>bs){bs=s;b=r}});if(!b)break;pl[i]=b.id;used.push(b.id);cu[b.cu]=(cu[b.cu]||0)+1;let p=b.ing.find(x=>PROT.includes(x.k));prev=p?p.k:'';b.ing.forEach(x=>!x.s&&keys.add(x.k))}
if(c.length<7)PM='Tercihlerinize uyan yeterli tarif yok (yalnızca '+c.length+'); bazı yemekler tekrar ediyor. Tarif kataloğu genişledikçe plan daha çeşitli olur.';else PM='Plan; art arda aynı ana proteini ve aynı mutfağı azaltacak, ortak malzemeleri tercih edecek şekilde oluşturuldu. Bu, mükemmel bir optimizasyon değil, basit bir sezgisel yöntemdir.';S.plan=pl;sv();render()}
function ts(id){let x=S.shop.find(i=>i.id==id);x.done=!x.done;sv();render()}
function ds(id){S.shop=S.shop.filter(i=>i.id!=id);sv();render()}
function man(){let n=document.getElementById('mn').value.trim();if(!n)return alert('Ürün adı yazın.');let k=Object.keys(IN).find(x=>IN[x].n.toLowerCase()==n.toLowerCase())||'';S.shop.push({id:Date.now(),n:esc(n),k,q:0,u:'',done:0});sv();render()}
function ss(f,v){S.set[f]=f=='diet'?v:+v;sv();render()}
function av(){let k=document.getElementById('avs').value;if(k&&!S.set.avoid.includes(k)){S.set.avoid.push(k);sv();render()}}
function ra(k){S.set.avoid=S.set.avoid.filter(x=>x!=k);sv();render()}
function pl(id){let d=document.getElementById('pd').value;S.plan[d]=id;sv();alert(DAYS[d]+' akşam yemeğine eklendi.')}
function shr(id){let r=RB[id],t=r.n+' — Ne Pişirsem?\n'+r.ing.map(i=>'• '+nm(i.k)).join('\n');navigator.share?navigator.share({title:r.n,text:t}).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>alert('Tarif panoya kopyalandı.'))}
function home(){let rk=ranked(),soon=Object.keys(S.pan).filter(k=>S.pan[k].exp&&S.pan[k].st!='bitti'&&days(S.pan[k].exp)<=3),sr=R.filter(okR).map(r=>({r,n:r.ing.filter(i=>soon.includes(i.k)).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,3).map(x=>x.r);
let ft=['Japon','Meksika','İtalyan','Hint','Kore','Yunan'].map(c=>rk.find(x=>x.r.cu==c)).filter(Boolean).map(x=>x.r).slice(0,4);
return`<div class="hero"><small>Merhaba! 👋</small><h1>Bugün ne pişirelim?</h1><button class="bt w" onclick="go('pan')">Evdeki malzemelerimle yemek bul</button><button class="bt g w" onclick="surprise()">Bana sürpriz yap! 🎲</button></div>
<input class="w" placeholder="Tarif ara…" aria-label="Tarif ara" onkeydown="if(event.key=='Enter'){Q=this.value;go('rec')}"><div>${[['t15','15 dakikada hazır'],['eco','Ekonomik'],['one','Tek tencere'],['kid','Çocuk dostu'],['dish','Az bulaşık']].map(a=>`<button class="ch" onclick="F={};F['${a[0]}']=1;Q='';go('rec')">${a[1]}</button>`).join('')}</div>
<h2>⏳ Bozulmadan değerlendir</h2>${soon.length?`<p>${soon.map(k=>`<span class="mi">${nm(k)}</span> (${days(S.pan[k].exp)<0?'tarihi geçti':days(S.pan[k].exp)+' gün'})`).join(', ')}</p>`+cards(sr):'<div class="note">Kilerde son kullanma tarihi yaklaşan malzeme yok. Malzemelerinize tarih ekleyerek burada öneri alabilirsiniz.</div>'}
<div class="note">Tarih geçmemiş olsa bile yiyeceği koklayıp inceleyin ve saklama koşullarına uyun. Şüphe duyarsanız tüketmeyin.<br>${LEFT.map(x=>'• '+x).join('<br>')}</div>
<h2>Kilerine göre öneriler</h2>${cards(rk.slice(0,4).map(x=>x.r))}<h2>Dünya mutfağından</h2>${cards(ft)}${S.rec.length?'<h2>Son baktıkların</h2>'+cards(S.rec.map(i=>RB[i]).slice(0,3)):''}`}
function pan(){let ks=Object.keys(S.pan),u=['g','ml','adet','bardak','yk','kutu','diş'];
return`<h2>🥕 Malzemelerim (${ks.length})</h2><p><small>Miktar ve tarih isteğe bağlıdır; tarif bulmak için gerekmez.</small></p>${ks.map(k=>{let p=S.pan[k];return`<div class="pr"><b>${nm(k)} ${p.exp&&days(p.exp)<=3?'<span class="mi">⏳</span>':''}</b><select aria-label="Durum" onchange="pu('${k}','st',this.value)">${[['var','Var'],['az','Azaldı'],['bitti','Bitti']].map(o=>`<option value="${o[0]}" ${p.st==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><input type="number" min="0" placeholder="miktar" value="${p.q||''}" onchange="pu('${k}','q',this.value)"><select aria-label="Birim" onchange="pu('${k}','u',this.value)"><option value="">birim</option>${u.map(x=>`<option ${p.u==x?'selected':''}>${x}</option>`).join('')}</select><input type="date" aria-label="Son kullanma" value="${p.exp||''}" onchange="pu('${k}','exp',this.value)"><button class="ib" aria-label="Sil" onclick="tg('${k}')">🗑</button></div>`}).join('')||'<div class="note">Henüz malzeme yok. Aşağıdan dokunarak ekleyin.</div>'}
<button class="bt w" onclick="go('rec')">Tarifleri gör →</button><h2>Malzeme ekle</h2><div class="row"><input class="w" placeholder="Ara veya özel malzeme yaz…" aria-label="Malzeme ara" value="${esc(PQ)}" oninput="PQ=this.value;cl()"><button class="bt o" onclick="addC()">Özel ekle</button></div><div id="cat">${catList()}</div>`}
function rec(){let cs=[...new Set(R.map(r=>r.cu))].sort();return`<input class="w" id="q" placeholder="Tarif, mutfak veya yemek türü ara…" aria-label="Ara" value="${esc(Q)}" oninput="Q=this.value;lst()"><div>${[['all','Tüm malzemelerim var'],['two','En fazla 2 eksiğim var'],['t30','30 dk içinde'],['eco','En ekonomik'],['dish','En az bulaşık'],['one','Tek tencere'],['kid','Çocuk dostu']].map(a=>`<button class="ch ${F[a[0]]?'on':''}" onclick="tf('${a[0]}')">${a[1]}</button>`).join('')}</div><select aria-label="Mutfak" onchange="F.cu=this.value;render()"><option value="">Tüm mutfaklar</option>${cs.map(c=>`<option ${F.cu==c?'selected':''}>${c}</option>`).join('')}</select>${S.set.diet?`<p><small>Diyet filtresi aktif: ${DM[S.set.diet]}</small></p>`:''}<div id="list">${cards(filt())}</div>`}
function det(){let r=RB[DV.id],m=mt(r),f=DV.s/r.sv,L=lab(r),A=alg(r);
return`<button class="bt o" onclick="go('rec')">← Geri</button><div class="big" style="background:${grad(r.id)};margin-top:8px">${r.e}</div><h1>${r.n}</h1><small>${r.o?r.o+' · ':''}${r.cu} mutfağı · ${r.cat}</small><p>⏱ ${r.t} dk · ${r.z} · ${'₺'.repeat(r.c)} <small>(yaklaşık)</small></p><p>${L.map(x=>`<span class="b">${x}</span> `).join('')}</p>
<div class="row"><button class="bt o" onclick="DV.s=Math.max(1,DV.s-1);render()" aria-label="Azalt">−</button><b>${DV.s} porsiyon</b><button class="bt o" onclick="DV.s++;render()" aria-label="Artır">+</button></div>
<h2>Malzemeler</h2>${r.ing.map(i=>{let h=i.s||have(i.k),a=!h&&SUB[i.k]&&have(SUB[i.k]);return`<div class="row ${h?'':'mi'}">${i.s?'◦':h?'✅':'❌'} ${fmt(i.q*f)} ${i.u} ${nm(i.k)}${a?` <small>(alternatif: ${nm(SUB[i.k])} — aynısı değildir)</small>`:''}${i.s?' <small>(temel)</small>':''}</div>`}).join('')}
<div class="note">${m.miss.length?'Eksik: '+m.miss.map(i=>nm(i.k)).join(', '):'Tüm temel malzemeler kilerinde var!'}${A.length?'<br>İçerir: '+A.join(', ')+'.':''}<br>Etiketler tarif malzemelerine göre otomatiktir; alerjiniz varsa ambalaj etiketlerini ve çapraz bulaşmayı kontrol edin.</div>
<button class="bt w" onclick="CS=0;go('cook')">👨‍🍳 Pişirmeye başla</button><button class="bt g w" onclick="addMiss(${r.id})">🛒 Eksikleri listeye ekle</button><div class="row"><select id="pd">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><button class="bt o" onclick="pl(${r.id})">Plana ekle</button><button class="bt o" onclick="tfav(${r.id})" aria-label="Favori">${S.fav.includes(r.id)?'❤️':'🤍'}</button><button class="bt o" onclick="shr(${r.id})">Paylaş</button></div>
<h2>Yapılışı</h2>${r.st.map((s,i)=>`<p><b>${i+1}.</b> ${s}.</p>`).join('')}`}
function cook(){let r=RB[DV.id];return`<div class="cook"><button class="bt o" onclick="go('det')">✕ Kapat</button><h2>${r.n}</h2><div class="bar"><i style="width:${(CS+1)/r.st.length*100}%"></i></div><small>Adım ${CS+1} / ${r.st.length}</small><p>${r.st[CS]}.</p><div class="row"><button class="bt o w" ${CS?'':'disabled'} onclick="CS--;render()">← Önceki</button><button class="bt w" onclick="${CS<r.st.length-1?'CS++;render()':"go('det')"}">${CS<r.st.length-1?'Sonraki →':'Afiyet olsun! 🎉'}</button></div></div>`}
function plan(){return`<h2>📅 Haftalık Plan (akşam yemeği)</h2><button class="bt w" onclick="auto()">✨ Otomatik plan oluştur</button><button class="bt g w" onclick="fromPlan()">🛒 Plandan alışveriş listesi</button>${PM?`<div class="note">${PM}</div>`:''}${DAYS.map((d,i)=>{let r=RB[S.plan[i]];return`<div class="pr"><b>${d}</b><select aria-label="${d}" onchange="sp(${i},this.value)"><option value="">— Seçilmedi —</option>${R.filter(okR).map(x=>`<option value="${x.id}" ${S.plan[i]==x.id?'selected':''}>${x.n}</option>`).join('')}</select>${r?`<button class="bt o" onclick="show(${r.id})">${r.e} Aç</button>`:''}</div>`}).join('')}<p><small>Kahvaltı/öğle yuvaları bu sürümde yok. Porsiyon: ${S.set.serv} (Tercihler'den değişir).</small></p>`}
function shop(){let g={};S.shop.forEach(i=>{let c=(IN[i.k]&&IN[i.k].c)||'z';(g[c]=g[c]||[]).push(i)});return`<h2>🛒 Alışveriş Listesi</h2><div class="row"><input class="w" id="mn" placeholder="Ürün ekle…" aria-label="Ürün"><button class="bt" onclick="man()">Ekle</button></div>${Object.keys(CAT).filter(c=>g[c]).map(c=>`<h3>${CAT[c]}</h3>`+g[c].map(i=>`<div class="row"><input type="checkbox" ${i.done?'checked':''} onchange="ts(${i.id})" aria-label="Alındı"><span class="${i.done?'done':''}" style="flex:1">${i.n}${i.q?` — ${fmt(i.q)} ${i.u}`:''}</span><button class="ib" aria-label="Sil" onclick="ds(${i.id})">🗑</button></div>`).join('')).join('')||'<div class="note">Liste boş. Bir tarifteki eksikleri veya haftalık planı ekleyin.</div>'}${S.shop.some(i=>i.done)?`<button class="bt o w" onclick="S.shop=S.shop.filter(i=>!i.done);sv();render()">Alınanları temizle</button>`:''}`}
function set(){let s=S.set;return`<h2>⚙️ Tercihler</h2><p>Porsiyon<br><input type="number" min="1" max="12" value="${s.serv}" onchange="ss('serv',this.value)"></p><p>Diyet<br><select onchange="ss('diet',this.value)"><option value="">Yok</option>${Object.keys(DM).map(k=>`<option value="${k}" ${s.diet==k?'selected':''}>${DM[k]}</option>`).join('')}</select></p><p>En fazla süre<br><select onchange="ss('maxT',this.value)">${[[0,'Sınırsız'],[15,'15 dk'],[30,'30 dk'],[60,'60 dk']].map(o=>`<option value="${o[0]}" ${s.maxT==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></p><p>Alerji / sevmediğim malzemeler (bu malzemeli tarifler gizlenir)<br><span class="row"><select id="avs">${Object.keys(IN).filter(k=>!IN[k].c.match(/[y]/)||k!='su').map(k=>`<option value="${k}">${IN[k].n}</option>`).join('')}</select><button class="bt o" onclick="av()">Ekle</button></span>${s.avoid.map(k=>`<button class="ch on" onclick="ra('${k}')">${nm(k)} ✕</button>`).join('')}</p><div class="note">Veriler yalnızca bu tarayıcıda saklanır; hesap/cihazlar arası eşitleme yoktur. Tarif verisi eksik olabilir: alerjisi olanlar malzemeleri ve ambalaj bilgilerini mutlaka kontrol etmelidir. Yapay zekâ asistanı bu sürümde yok; öneriler kural tabanlı yerel algoritmayla yapılır.</div>`}
function render(){let c={home,pan,rec,det,cook,plan,shop,set,fav:()=>`<h2>❤️ Kaydedilenler</h2>${S.fav.length?cards(S.fav.map(i=>RB[i])):'<div class="note">Henüz favori yok. Bir tarifte 🤍 simgesine dokunun.</div>'}`}[V];document.getElementById('app').innerHTML=c();
let T=[['home','🏠','Ana Sayfa'],['pan','🥕','Malzemelerim'],['rec','📖','Tarifler'],['plan','📅','Planım'],['fav','❤️','Kaydedilenler']];document.getElementById('nav').innerHTML=T.map(t=>`<button class="${V==t[0]||(V=='det'&&t[0]=='rec')?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');let n=S.shop.filter(i=>!i.done).length;document.getElementById('sc').textContent=n||''}
render();
</script></body></html>
